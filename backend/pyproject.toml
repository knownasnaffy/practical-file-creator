[project]
name = "pfc-backend"
version = "0.1.0"
description = "Practical File Generator Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "python-frontmatter>=1.1.0",
    "pypdf>=4.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
